<title>Aqim Profile Picture</title>
<style>
:root {
  --bg: #f3eee3;
  --ink: #1c2830;
  --muted: #5b6b74;
  --card: #ffffff;
  --border: #e4dcc9;
  --accent: #b99257;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c2830;
    --ink: #f3eee3;
    --muted: #9aa7ad;
    --card: #23323b;
    --border: #33454f;
    --accent: #c9a671;
  }
}
:root[data-theme="dark"] {
  --bg: #1c2830;
  --ink: #f3eee3;
  --muted: #9aa7ad;
  --card: #23323b;
  --border: #33454f;
  --accent: #c9a671;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Cairo", "Segoe UI", system-ui, sans-serif;
  margin: 0;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-inline: 20px;
}
link { display: none; }

.wrap {
  width: 100%;
  max-width: 360px;
  padding-block: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  text-align: center;
}

h1 {
  font-size: 1.1rem;
  font-weight: 800;
  margin: 0;
  text-wrap: balance;
}

.frame {
  width: 220px;
  height: 220px;
  border-radius: 9999px;
  overflow: hidden;
  border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}
.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hint {
  font-size: 0.85rem;
  color: var(--muted);
  line-height: 1.6;
  max-width: 320px;
}
.hint strong {
  color: var(--ink);
}
</style>
