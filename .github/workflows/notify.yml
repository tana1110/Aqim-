name: Send reminder notifications

# DISABLED (2026-09-02): GitHub's scheduled-workflow trigger turned out to be
# unreliable for this — real run logs showed gaps of 2 to 5.5 hours between
# supposedly-every-5-minute firings, GitHub silently deprioritizes cron
# triggers on free/quiet repos. Replaced with cron-job.org, which actually
# fires on schedule. Kept as workflow_dispatch (manual trigger) for testing;
# the schedule trigger is intentionally removed, not just paused.
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping notify endpoint
        run: |
          curl -fsS -X POST "https://aqimalsalat.app/api/cron/notify" \
            -H "x-cron-key: ${{ secrets.CRON_KEY }}" \
            -m 60
